{% extends "base.html" %}
{% block content %}

<style>
/* Header + Add Button */
.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.add-btn {
    background: #007bff;
    color: white;
    padding: 10px 18px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.2s;
}

.add-btn:hover {
    background: #0056b3;
}

/* Table Styling */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

table th {
    background: #f1f5ff;
    padding: 12px;
    text-align: left;
    font-weight: bold;
    color: #333;
    border-bottom: 2px solid #dce3f0;
}

table td {
    padding: 12px;
    border-bottom: 1px solid #e8e8e8;
}

/* Action links */
.action-link {
    color: #007bff;
    text-decoration: none;
    font-weight: 600;
}

.action-link:hover {
    text-decoration: underline;
}

.delete-link {
    color: #e60000;
    font-weight: bold;
}

.delete-link:hover {
    text-decoration: underline;
}
</style>

<div class="card">

    <div class="page-header">
        <h2 style="margin: 0;">Customers</h2>

        <!-- Correct Route -->
        <a href="{{ url_for('show_add_customer_form') }}" class="add-btn">
            + Add Customer
        </a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
                <th style="width: 140px;">Actions</th>
            </tr>
        </thead>

        <tbody>
        {% for c in customers %}
            <tr>
                <td>{{ c.cust_id }}</td>
                <td>{{ c.cust_name }}</td>
                <td>{{ c.email }}</td>
                <td>{{ c.city }}</td>

                <td>
                    <a class="action-link" href="{{ url_for('edit_customer', id=c.cust_id) }}">
                        Edit
                    </a>

                    &nbsp;|&nbsp;

                    <a class="delete-link"
                       href="{{ url_for('delete_customer', id=c.cust_id) }}"
                       onclick="return confirm('Are you sure you want to delete this customer?');">
                        Delete
                    </a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>

</div>

{% endblock %}
