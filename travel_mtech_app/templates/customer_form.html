{% extends "base.html" %}
{% block content %}

<style>
    .form-card {
        background: white;
        padding: 30px;
        width: 600px;
        margin: auto;
        border-radius: 14px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    .form-title {
        font-size: 26px;
        font-weight: 700;
        text-align: center;
        color: #333;
        margin-bottom: 25px;
    }

    .input-group {
        margin-bottom: 18px;
        position: relative;
    }

    .input-group input {
        width: 100%;
        padding: 12px 14px;
        border: 2px solid #d9e4f0;
        border-radius: 10px;
        font-size: 15px;
        transition: 0.3s;
        background: #f7faff;
    }

    .input-group input:focus {
        border-color: #4a90e2;
        background: white;
        box-shadow: 0 0 6px rgba(74,144,226,0.3);
    }

    .input-group label {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 14px;
        color: #777;
        pointer-events: none;
        transition: 0.3s;
        background: white;
        padding: 0 5px;
    }

    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {
        top: -6px;
        font-size: 12px;
        color: #4a90e2;
    }

    .btn-primary {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #4a90e2, #007bff);
        border: none;
        color: white;
        border-radius: 10px;
        font-size: 17px;
        cursor: pointer;
        font-weight: bold;
    }

    .btn-cancel {
        display: block;
        text-align: center;
        margin-top: 12px;
        color: #555;
        text-decoration: none;
        font-weight: bold;
    }
</style>

<div class="form-card">
    <div class="form-title">{{ action }} Customer</div>

    <!-- IMPORTANT: Correct POST action -->
    {% if action == 'Add' %}
        <form method="post" action="{{ url_for('add_customer') }}">
    {% else %}
        <form method="post">
    {% endif %}

        <div class="input-group">
            <input type="text" name="cust_name" placeholder=" " required
                   value="{{ customer.cust_name if customer else '' }}">
            <label>Name</label>
        </div>

        <div class="input-group">
            <input type="email" name="email" placeholder=" " required
                   value="{{ customer.email if customer else '' }}">
            <label>Email</label>
        </div>

        <div class="input-group">
            <input type="text" name="city" placeholder=" "
                   value="{{ customer.city if customer else '' }}">
            <label>City</label>
        </div>

        <button class="btn-primary">{{ action }}</button>
        <a href="{{ url_for('customers') }}" class="btn-cancel">Cancel</a>

    </form>
</div>

{% endblock %}
