{% extends "base.html" %}
{% block content %}

<style>
    .dest-card {
        background: #ffffff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.10);
        width: 60%;
        margin: auto;
        margin-top: 25px;
    }

    h3 {
        font-size: 1.8rem;
        font-weight: 600;
        margin-bottom: 20px;
        color: #1976D2;
        text-align:center;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-bottom: 20px;
    }

    input, select {
        padding: 12px;
        width: 100%;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 1rem;
    }

    input:focus, select:focus {
        outline: none;
        border-color: #1976D2;
        box-shadow: 0 0 5px rgba(25,118,210,0.3);
    }

    .btn-main {
        background: #1976D2;
        color: white;
        border: none;
        padding: 12px 22px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
    }

    .btn-main:hover {
        background: #0e52a8;
    }

    .btn-cancel {
        background: #e53935;
        color: white;
        border: none;
        padding: 12px 22px;
        border-radius: 6px;
        cursor: pointer;
        margin-left: 10px;
    }

    .btn-cancel:hover {
        background: #b71c1c;
    }

    .btn-group {
        text-align: center;
        margin-top: 10px;
    }
</style>

<div class="dest-card">
    <h3>{{ action }} Destination</h3>

    <form method="post">

        <div class="form-grid">

            <div>
                <label>Destination Name</label>
                <input name="dest_name" placeholder="Example: Paris, Goa, Tokyo"
                       value="{{ dest.dest_name if dest else '' }}" required>
            </div>

            <div>
                <label>Country</label>
                <input name="country" placeholder="Example: France, India"
                       value="{{ dest.country if dest else '' }}" required>
            </div>

            <div>
                <label>Base Price (per person)</label>
                <input name="base_price" type="number" min="1000" step="100"
                       placeholder="Enter price"
                       value="{{ dest.base_price if dest else '' }}" required>
            </div>

            <div>
                <label>Season</label>
                <select name="season" required>
                    <option value="">Select season</option>
                    <option value="Peak" 
                        {% if dest and dest.season == "Peak" %}selected{% endif %}>
                        Peak (High Demand)
                    </option>
                    <option value="Moderate" 
                        {% if dest and dest.season == "Moderate" %}selected{% endif %}>
                        Moderate
                    </option>
                    <option value="Off-Season" 
                        {% if dest and dest.season == "Off-Season" %}selected{% endif %}>
                        Off-Season (Budget Friendly)
                    </option>
                </select>
            </div>

        </div>

        <div class="btn-group">
            <button class="btn-main">{{ action }}</button>
            <a href="{{ url_for('destinations') }}">
                <button type="button" class="btn-cancel">Cancel</button>
            </a>
        </div>

    </form>
</div>

{% endblock %}
